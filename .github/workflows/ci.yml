name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:electron-permissions
      - run: npm run audit:final
      - run: npm run audit:release
      - run: npm run audit:speaker

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore,storage --project demo-cavity "node scripts/firebase-emulator-smoke.mjs"

  # Download-button UI tests: real built server x3 (valid release / empty RELEASES_DIR / tampered manifest),
  # driven by Playwright through Electron's Chromium. Needs a display, hence xvfb.
  e2e-download-button:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
